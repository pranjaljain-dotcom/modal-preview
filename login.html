<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Sign in — Ethos Agent Portal</title>
  <style>
    @font-face {
      font-family: 'Theinhardt';
      src: url('Theinhardt/Theinhardt-Light.otf') format('opentype');
      font-weight: 300; font-style: normal;
    }
    @font-face {
      font-family: 'Theinhardt';
      src: url('Theinhardt/Theinhardt-Regular.otf') format('opentype');
      font-weight: 400; font-style: normal;
    }
    @font-face {
      font-family: 'Theinhardt';
      src: url('Theinhardt/Theinhardt-Medium.otf') format('opentype');
      font-weight: 500; font-style: normal;
    }
    @font-face {
      font-family: 'Theinhardt';
      src: url('Theinhardt/Theinhardt-Bold.otf') format('opentype');
      font-weight: 700; font-style: normal;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Theinhardt', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      min-height: 100vh;
    }

    .auth-page {
      min-height: 100vh;
      background: linear-gradient(-70.43deg, #e6f5ec 0%, #ebf0f9 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .auth-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      width: 100%;
      max-width: 480px;
    }

    .auth-logo img {
      height: 20px;
      width: 83px;
      object-fit: contain;
      object-position: center;
    }

    .auth-card {
      background: #fff;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      box-shadow: 0px 1px 2px rgba(16,24,40,0.06), 0px 1px 3px rgba(16,24,40,0.1);
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .auth-heading { display: flex; flex-direction: column; gap: 8px; }

    .auth-title {
      font-size: 24px;
      font-weight: 500;
      line-height: 32px;
      color: #272727;
      letter-spacing: -0.24px;
    }

    .auth-subtitle {
      font-size: 16px;
      font-weight: 400;
      line-height: 24px;
      color: #525252;
    }

    .field { display: flex; flex-direction: column; gap: 8px; }

    .field-label {
      font-size: 16px;
      font-weight: 500;
      line-height: 24px;
      color: #525252;
    }

    /* Password input wrapper — for the show/hide toggle */
    .password-wrap { position: relative; }

    .text-input {
      height: 56px;
      border: 1px solid #d4d4d4;
      border-radius: 8px;
      padding: 16px 44px 16px 14px;
      font-size: 16px;
      font-weight: 400;
      line-height: 24px;
      color: #272727;
      background: #fff;
      width: 100%;
      outline: none;
      font-family: inherit;
      box-shadow: 0px 1px 2px rgba(16,24,40,0.05);
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .text-input::placeholder { color: #7e7e7e; }
    .text-input:focus {
      border-color: #056257;
      box-shadow: 0px 1px 2px rgba(16,24,40,0.05), 0 0 0 4px rgba(5,98,87,0.12);
    }

    .toggle-visibility {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      color: #7e7e7e;
      font-size: 13px;
      font-family: inherit;
      font-weight: 500;
      line-height: 20px;
      transition: color 0.15s;
    }
    .toggle-visibility:hover { color: #272727; }

    .error-msg {
      font-size: 13px;
      color: #d92d20;
      line-height: 20px;
    }

    .btn-continue {
      width: 100%;
      height: 60px;
      background: #272727;
      border: 1px solid #272727;
      border-radius: 8px;
      color: #fff;
      font-size: 20px;
      font-weight: 500;
      line-height: 28px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
      font-family: inherit;
    }
    .btn-continue:hover { background: #3a3a3a; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%       { transform: translateX(-6px); }
      40%       { transform: translateX(6px); }
      60%       { transform: translateX(-4px); }
      80%       { transform: translateX(4px); }
    }
    .shake { animation: shake 0.35s ease; }
  </style>
</head>
<body>

  <div class="auth-page">
    <div class="auth-center">

      <div class="auth-logo">
        <img src="icons/82084956-24dc-4ef4-915e-75495b6d32dd.svg" alt="Ethos" />
      </div>

      <div class="auth-card">
        <div class="auth-heading">
          <h1 class="auth-title">Welcome to Ethos Agent Portal</h1>
          <p class="auth-subtitle">Enter the access password to view this prototype.</p>
        </div>

        <div class="field">
          <label class="field-label" for="auth-password">Password</label>
          <div class="password-wrap">
            <input
              class="text-input"
              id="auth-password"
              type="password"
              placeholder="Enter access password"
              autocomplete="current-password"
            />
            <button class="toggle-visibility" id="btn-toggle" type="button" tabindex="-1">Show</button>
          </div>
          <p class="error-msg" id="pw-error" style="display:none;">Incorrect password. Please try again.</p>
        </div>

        <button class="btn-continue" id="btn-enter">Continue</button>
      </div>

    </div>
  </div>

  <script>
    /* ── Redirect if already authenticated ─────────────── */
    try {
      const auth = JSON.parse(sessionStorage.getItem('ethosAuth') || 'null');
      if (auth && auth.ok) window.location.replace('policy-owner.html');
    } catch (e) {}

    const PASSWORD = 'CLAUD#pass';

    const input   = document.getElementById('auth-password');
    const btn     = document.getElementById('btn-enter');
    const toggle  = document.getElementById('btn-toggle');
    const errMsg  = document.getElementById('pw-error');
    const card    = document.querySelector('.auth-card');

    /* Show / hide password */
    toggle.addEventListener('click', () => {
      const isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';
      toggle.textContent = isHidden ? 'Hide' : 'Show';
    });

    function attempt() {
      errMsg.style.display = 'none';
      input.style.borderColor = '';
      input.style.boxShadow = '';

      if (input.value === PASSWORD) {
        sessionStorage.setItem('ethosAuth', JSON.stringify({ ok: true, time: Date.now() }));
        window.location.replace('policy-owner.html');
      } else {
        input.style.borderColor = '#d92d20';
        input.style.boxShadow = '0 0 0 4px rgba(217,45,32,0.12)';
        errMsg.style.display = 'block';
        card.classList.remove('shake');
        void card.offsetWidth; // reflow to restart animation
        card.classList.add('shake');
        input.select();
        input.addEventListener('input', () => {
          input.style.borderColor = '';
          input.style.boxShadow = '';
          errMsg.style.display = 'none';
        }, { once: true });
      }
    }

    btn.addEventListener('click', attempt);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') attempt(); });
  </script>

</body>
</html>
